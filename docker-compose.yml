version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linli_tool_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:////app/data/linli_tool.db
      - JWT_SECRET=linli-tool-super-secret-jwt-key-for-ai-pm-competition-2026
      - HMAC_SECRET=linli-tool-hmac-invitation-secret-key-2026
      - GEMINI_API_KEY=${GEMINI_API_KEY:-mock_key_for_offline_testing}
    volumes:
      - linli_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  linli_data:
    driver: local
